version: '3'

vars:
  BINARY_NAME: if97_lab_calculator
  WINDOWS_TARGET: x86_64-pc-windows-msvc

tasks:
  default:
    desc: Список всех доступных команд
    cmds:
      - task --list

  check:
    desc: Быстрая проверка всего воркспейса на ошибки
    cmds:
      - cargo check --workspace

  test:
    desc: Запуск всех тестов (включая интеграционные с выводом консоли)
    cmds:
      - cargo test --workspace -- --nocapture

  # --- ДЕСКТОП ---
  build:desktop-win:
    desc: Кросс-компиляция десктопного приложения под Windows (x64)
    cmds:
      - cargo xwin build --target {{.WINDOWS_TARGET}} --release -p desktop_app
    sources:
      - core/src/**/*.rs
      - desktop_fltk/src/**/*.rs
    generates:
      - target/{{.WINDOWS_TARGET}}/release/desktop_app.exe

  run:desktop:
    desc: Запуск десктопного приложения (локально на Mac)
    cmds:
      - cargo run -p desktop_app

  # --- WebAssembly ---
  build:wasm:
    desc: Сборка WASM пакета для фронтенда
    dir: wasm_api
    cmds:
      - wasm-pack build --target web
    sources:
      - ../core/src/**/*.rs
      - src/**/*.rs
    generates:
      - pkg/**/*

  # --- gRPC & DOCKER ---
  build:docker:
    desc: Сборка Docker-образа с gRPC сервером
    cmds:
      - docker build -t if97-grpc-server -f grpc_server/Dockerfile .

  run:grpc:
    desc: Локальный запуск gRPC сервера
    cmds:
      - cargo run -p grpc_server

  # --- ОЧИСТКА ---
  clean:
    desc: Полная очистка всех артефактов сборки
    cmds:
      - cargo clean
      - rm -rf wasm_api/pkg