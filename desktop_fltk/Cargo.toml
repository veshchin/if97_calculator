# File: Cargo.toml

[package]
name = "desktop_app"
version = "0.1.0"
edition = "2024"

[dependencies]
if97_core = { path = "../core" }
fltk = { version = "1.4", features = ["fltk-bundled"] }
# Plotters для рендеринга графиков в буфер FLTK
plotters = "0.3"
# Логирование
tracing = "0.1"
tracing-subscriber = "0.3"
webbrowser = "1.0"
chrono = "0.4"
csv = "1.3"