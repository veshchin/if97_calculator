# File: Cargo.toml

# Метаданные пакета библиотеки
[package]
name = "if97_core"
version = "0.1.1"
edition = "2024"

# Зависимости, необходимые для работы самой библиотеки (runtime)
[dependencies]
# Используется для сериализации и десериализации структур (например, WaterState и Region)
serde = { version = "1.0", features = ["derive"] }
# Легковесный фасад для логирования (информация об итерациях, маршрутизации и ошибках)
tracing = "0.1"

# Зависимости, используемые только во время тестирования (test)
[dev-dependencies]
# Для чтения контрольных точек стандарта IAPWS из внешних файлов в интеграционных тестах
csv = "1.3"
# Для автоматического маппинга строк CSV в тестовые Rust-структуры
serde = { version = "1.0", features = ["derive"] }