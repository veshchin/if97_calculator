apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: if97-calculator-service
  labels:
    app.kubernetes.io/name: if97-calculator-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: if97-calculator-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
