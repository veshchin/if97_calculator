apiVersion: apps/v1
kind: Deployment
metadata:
  name: if97-calculator-service
  labels:
    app.kubernetes.io/name: if97-calculator-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: if97-calculator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: if97-calculator-service
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: if97-calculator-service
      containers:
        - name: api
          image: ghcr.io/veshchin/if97_calculator_service:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: IF97_GRPC_ADDR
              value: 0.0.0.0:50051
            - name: RUST_LOG
              value: info
            - name: IF97_KERNEL
              value: core
            - name: IF97_IO_THREADS
              value: "2"
            - name: IF97_CPU_THREADS
              value: "2"
            - name: IF97_MAX_IN_FLIGHT_PER_CONN
              value: "2"
            - name: IF97_MAX_IN_FLIGHT_GLOBAL
              value: "2"
            - name: IF97_MAX_BATCH_LEN
              value: "200000"
            - name: IF97_GRPC_MAX_MSG_BYTES
              value: "33554432"
            - name: IF97_DRAIN_SECS
              value: "2"
          readinessProbe:
            grpc:
              port: 50051
              service: if97.v1.If97Service
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            grpc:
              port: 50051
              service: if97.v1.If97Service
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 3"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
