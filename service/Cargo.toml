[package]
name = "if97_calculator_service"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "time", "sync", "signal"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.12.3", features = ["transport"] }
tonic-health = "0.12.3"
prost = "0.13.5"
rayon = "1.11.0"
num_cpus = "1.17.0"
if97_core = { path = "../core" }
serde = { version = "1.0", features = ["derive"], optional = true }
csv = { version = "1.3", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[features]
default = []
loadtest = ["dep:serde", "dep:csv"]

[[bin]]
name = "if97_loadtest"
path = "src/bin/if97_loadtest.rs"
required-features = ["loadtest"]

[[bin]]
name = "grpc_loadtest"
path = "src/bin/grpc_loadtest.rs"

[build-dependencies]
tonic-build = "0.12.3"
