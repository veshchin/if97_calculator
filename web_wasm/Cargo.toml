[package]
name = "web_wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"

plotters = "0.3"
plotters-canvas = "0.3"
if97_core = { path = "../core" }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-wasm = "0.2.1"
wasm-bindgen-futures = "0.4.64"
serde-wasm-bindgen = "0.6.5"
once_cell = "1.21.4"
tracing-subscriber = "0.3.23"
gloo-timers = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlCanvasElement",
    "EventTarget",
    "Event",
    "MouseEvent",
    "console"
]