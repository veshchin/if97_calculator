name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Rust Tests (core + service + tauri backend)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test API DTOs
        run: cargo test -p if97_app_api

      - name: Test core
        run: cargo test -p if97_core

      - name: Test gRPC service
        run: cargo test -p if97_calculator_service

      - name: Test Tauri backend (smoke)
        run: cargo test -p if97_calculator_native

