name: Release IF97 Calculator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_suffix: WIN
            binary_ext: .exe
          - platform: macos-latest
            os_suffix: MAC
            binary_ext: ""
          - platform: ubuntu-22.04
            os_suffix: UBUNTU
            binary_ext: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y cmake libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # 1. Явная сборка фронтенда (Wasm/Yew) для всех
      - name: Build Frontend
        run: |
          cd wasm
          trunk build --release

      # 2. Сборка портативной версии (FLTK) - ТОЛЬКО ДЛЯ WINDOWS
      - name: Build FLTK Portable
        if: matrix.platform == 'windows-latest'
        run: cargo build --release -p if97_calculator_portable_win

      # 3. Переименование портативного бинарника - ТОЛЬКО ДЛЯ WINDOWS
      - name: Prepare Portable Artifact
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/if97_calculator_portable_win${{ matrix.binary_ext }} artifacts/IF97-PORTABLE-${{ matrix.os_suffix }}${{ matrix.binary_ext }}

      # 4. Сборка Tauri (Инсталляторы для всех ОС)
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "wasm"
          tagName: ${{ github.ref_name }}
          releaseName: "IF97 Calculator ${{ github.ref_name }}"
          releaseBody: "Автоматическая сборка: инсталляторы (Tauri) для всех ОС и портативный .exe (FLTK) для Windows."
          releaseDraft: true
          prerelease: false

      # 5. Загрузка портативного файла - ТОЛЬКО ДЛЯ WINDOWS
      - name: Upload Portable to Release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} artifacts/IF97-PORTABLE-${{ matrix.os_suffix }}${{ matrix.binary_ext }} --clobber
