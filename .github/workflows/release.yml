name: Release

on:
  push:
    tags:
      # Enforce SemVer tag format: vMAJOR.MINOR.PATCH
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler
          sudo apt-get install -y cmake libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14

      - name: Cache cargo build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check workspace
        run: cargo check --workspace

      - name: Check web target
        run: cargo check -p if97_calculator_web --target wasm32-unknown-unknown

      - name: Test core
        run: cargo test -p if97_core

  release:
    name: Release ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            fltk_ext: .exe
          - platform: macos
            runner: macos-latest
            fltk_ext: ""
          - platform: linux
            runner: ubuntu-22.04
            fltk_ext: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y cmake libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14

      - name: Cache cargo build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build FLTK application
        run: cargo build --release -p if97_calculator_fltk

      - name: Prepare FLTK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/if97_calculator_fltk${{ matrix.fltk_ext }} artifacts/if97_calculator_fltk-${{ matrix.platform }}${{ matrix.fltk_ext }}

      # WiX light.exe requires the Windows VBScript optional feature for MSI bundling.
      - name: Enable VBScript for WiX
        if: matrix.platform == 'windows'
        shell: powershell
        run: Enable-WindowsOptionalFeature -Online -FeatureName VBScript -All -NoRestart

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: true
        with:
          projectPath: wasm
          tagName: ${{ github.ref_name }}
          releaseName: IF97 Calculator ${{ github.ref_name }}
          releaseBody: |
            Автоматическая публикация релиза.

            Состав:
            - Tauri desktop bundles
            - FLTK standalone binaries
            - артефакты собраны из одного workspace и одного ядра if97_core
          releaseDraft: false
          prerelease: false

      - name: Upload FLTK artifact to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} artifacts/if97_calculator_fltk-${{ matrix.platform }}${{ matrix.fltk_ext }} --clobber

  docs-and-web:
    name: Docs + Web Artifacts
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14

      - name: Cache cargo build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build rustdoc (core + api + service)
        run: cargo doc -p if97_core -p if97_app_api -p if97_calculator_service --no-deps

      - name: Build web (WASM/Yew)
        env:
          NO_COLOR: true
        run: |
          cd wasm
          trunk build --release

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          touch target/doc/.nojekyll

          tar -C target -czf artifacts/if97-rustdoc-${{ github.ref_name }}.tar.gz doc
          tar -C wasm -czf artifacts/if97-web-${{ github.ref_name }}.tar.gz dist

      - name: Upload docs + web artifacts to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            artifacts/if97-rustdoc-${{ github.ref_name }}.tar.gz \
            artifacts/if97-web-${{ github.ref_name }}.tar.gz \
            --clobber
